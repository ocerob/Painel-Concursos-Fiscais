name: Atualização Automática do Painel Fiscal

on:
  schedule:
    # Executa todo domingo à meia-noite (UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Permite rodar manualmente com 1 clique quando desejar

jobs:
  atualizar-painel:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Executar Script de Atualização
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python atualizar_painel.py

      - name: Salvar e publicar alterações no repositório
        run: |
          git config --global user.name 'Robo-Painel-Fiscal'
          git config --global user.email 'robo@github.com'
          git add index.html
          git commit -m "Auto-update: Atualização semanal do painel fiscal" || exit 0
          git push
