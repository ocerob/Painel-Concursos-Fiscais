<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Semanal — Concursos da Área Fiscal | 29/10/2026</title>
<style>
  :root {
    --ink: #1e252b;
    --muted: #5c6773;
    --line: #d1d9e0;
    --panel: #f4f6f8;
    --accent: #3b5343; /* Verde Musgo */
    --accent-dark: #2c3f32;
    --accent-light: #4c6d56;
    --accent2: #eaf2ec;
    --warn-bg: #fef3c7;
    --warn-text: #92400e;
    --shadow: 0 4px 6px -1px rgba(30, 37, 43, 0.05), 0 2px 4px -2px rgba(30, 37, 43, 0.05);
    --shadow-hover: 0 10px 15px -3px rgba(30, 37, 43, 0.08), 0 4px 6px -4px rgba(30, 37, 43, 0.04);
  }

  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    background: linear-gradient(180deg, #f2f4f6 0%, #e5e9ed 100%);
    color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }

  .page {
    max-width: 1120px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  header {
    background: linear-gradient(135deg, #262d35 0%, #171c22 100%);
    color: white;
    padding: 36px 32px;
    border-radius: 16px;
    box-shadow: 0 10px 25px -5px rgba(23, 28, 34, 0.3);
    border-bottom: 4px solid var(--accent);
  }

  header h1 {
    margin: 0 0 8px;
    font-size: clamp(1.8rem, 4.5vw, 2.6rem);
    line-height: 1.15;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  header p {
    margin: 0;
    color: #a3b8a8;
    font-size: 1.05rem;
    font-weight: 500;
  }

  h2 {
    margin: 36px 0 16px;
    font-size: 1.5rem;
    color: #212830;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  h3 {
    margin: 0 0 8px;
    font-size: 1.12rem;
    color: #212830;
    font-weight: 700;
  }

  /* JANELA ROLÁVEL PARA NOVIDADES */
  .news-window {
    max-height: 520px;
    overflow-y: auto;
    padding: 12px;
    background: #d8dee3;
    border: 1px solid var(--line);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
  }

  .news-window::-webkit-scrollbar { width: 8px; }
  .news-window::-webkit-scrollbar-track { background: #d8dee3; border-radius: 8px; }
  .news-window::-webkit-scrollbar-thumb { background: #9daab5; border-radius: 8px; }
  .news-window::-webkit-scrollbar-thumb:hover { background: #7c8a95; }

  .card {
    background: white;
    border: 1px solid #e1e7ec;
    border-radius: 12px;
    padding: 20px;
    min-width: 0;
    box-shadow: var(--shadow);
    transition: all 0.2s ease-in-out;
  }

  .card:hover {
    box-shadow: var(--shadow-hover);
    border-color: var(--accent);
  }

  .tag {
    display: inline-block;
    font-size: .8rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 99px;
    background: var(--accent2);
    color: var(--accent);
    margin: 4px 0 10px;
  }

  .tag.warn {
    background: var(--warn-bg);
    color: var(--warn-text);
  }

  a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    overflow-wrap: anywhere;
  }

  a:hover { text-decoration: underline; }

  .muted {
    color: var(--muted);
    font-size: .92rem;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 12px 0 20px;
  }

  .controls input {
    padding: 12px 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: white;
    color: var(--ink);
    font: inherit;
    flex: 1 1 260px;
    box-shadow: var(--shadow);
    transition: border-color 0.2s ease;
  }

  .controls input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 16px 0;
  }

  .tabs button {
    border: 1px solid var(--line);
    background: white;
    border-radius: 10px;
    padding: 10px 20px;
    font: inherit;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: all 0.2s ease;
  }

  .tabs button:hover {
    color: var(--ink);
    border-color: var(--accent);
  }

  .tabs button.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
    box-shadow: 0 4px 12px rgba(59, 83, 67, 0.3);
  }

  .result-count {
    color: var(--muted);
    font-size: .92rem;
    font-weight: 500;
    margin-bottom: 12px;
  }

  /* SUBDIVISÕES DENTRO DAS ESFERAS */
  #contests {
    display: block;
    min-height: 100px;
  }

  .stage-section { margin-top: 28px; }

  .stage-title {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--accent);
    border-bottom: 2px solid var(--accent);
    padding-bottom: 8px;
    margin-bottom: 16px;
  }

  .contest-list {
    display: grid;
    gap: 16px;
    margin-bottom: 24px;
  }

  .contest {
    background: white;
    border: 1px solid #e1e7ec;
    border-radius: 12px;
    padding: 22px;
    box-shadow: var(--shadow);
    transition: all 0.2s ease-in-out;
    display: block;
  }

  .contest:hover {
    box-shadow: var(--shadow-hover);
    border-color: var(--accent);
  }

  .contest h3 { font-size: 1.25rem; }

  .meta {
    color: var(--muted);
    font-size: .92rem;
    margin-bottom: 10px;
  }

  .facts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 12px;
    margin: 16px 0;
  }

  .fact {
    background: var(--panel);
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #eaeff3;
  }

  .fact b {
    display: block;
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .contest p { margin: 10px 0; }

  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 12px;
    overflow: hidden;
  }

  th, td {
    text-align: left;
    vertical-align: top;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }

    background: #eaf2ec;
    color: var(--accent-dark);
