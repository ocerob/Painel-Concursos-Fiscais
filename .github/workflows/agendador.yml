name: Atualização Automática do Painel Fiscal

on:
  workflow_dispatch: # Permite rodar manualmente quando você quiser
  schedule:
    - cron: '0 9 * * *' # Roda automaticamente TODOS OS DIAS às 06:00 (horário de Brasília)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Executar script de atualização
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python atualizar_painel.py

      - name: Commit e Push das alterações
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dados.json
          git diff-index --quiet HEAD || git commit -m "Atualização diária automática do painel fiscal"
          git push
