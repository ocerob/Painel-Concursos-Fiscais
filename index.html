<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Semanal — Concursos da Área Fiscal | 29/10/2026</title>
<style>
  :root {
    --ink: #222831;
    --muted: #687482;
    --line: #393e46;
    --panel: #f7f9fb;
    --accent: #466952; /* Verde Musgo mais aparente e vibrante */
    --accent-dark: #334d3c;
    --accent-light: #598569;
    --accent2: #e2ede5;
    --warn-bg: #fef3c7;
    --warn-text: #92400e;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
    --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.15), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
  }

  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    /* Fundo da página em um tom cinza mais escuro e sofisticado */
    background: linear-gradient(180deg, #2b313a 0%, #1a1e24 100%);
    color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }

  .page {
    max-width: 1120px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  header {
    background: linear-gradient(135deg, #1f242b 0%, #12151a 100%);
    color: white;
    padding: 36px 32px;
    border-radius: 16px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    border-bottom: 4px solid var(--accent);
  }

  header h1 {
    margin: 0 0 8px;
    font-size: clamp(1.8rem, 4.5vw, 2.6rem);
    line-height: 1.15;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  header p {
    margin: 0;
    color: #b0c9b6;
    font-size: 1.05rem;
    font-weight: 500;
  }

  /* PAINEL QUADRICULADO DE RESUMO DAS FASES */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
    margin: 24px 0 32px;
  }

  .summary-box {
    background: white;
    border: 1px solid #d1d9e0;
    border-radius: 12px;
    padding: 16px 12px;
    text-align: center;
    box-shadow: var(--shadow);
  }

  .summary-num {
    display: block;
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--accent);
    line-height: 1.1;
  }

  .summary-label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-top: 4px;
  }

  h2 {
    margin: 36px 0 16px;
    font-size: 1.5rem;
    color: #ffffff;
    font-weight: 700;
    letter-spacing: -0.01em;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  h3 {
    margin: 0 0 8px;
    font-size: 1.12rem;
    color: #212830;
    font-weight: 700;
  }

  /* JANELA ROLÁVEL PARA NOVIDADES */
  .news-window {
    max-height: 520px;
    overflow-y: auto;
    padding: 12px;
    background: #171b21;
    border: 1px solid #323842;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
  }

  .news-window::-webkit-scrollbar { width: 8px; }
  .news-window::-webkit-scrollbar-track { background: #171b21; border-radius: 8px; }
  .news-window::-webkit-scrollbar-thumb { background: #424955; border-radius: 8px; }
  .news-window::-webkit-scrollbar-thumb:hover { background: #5a6373; }

  .card {
    background: white;
    border: 1px solid #e1e7ec;
    border-radius: 12px;
    padding: 20px;
    min-width: 0;
    box-shadow: var(--shadow);
    transition: all 0.2s ease-in-out;
  }

  .card:hover {
    box-shadow: var(--shadow-hover);
    border-color: var(--accent);
  }

  .tag {
    display: inline-block;
    font-size: .8rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 99px;
    background: var(--accent2);
    color: var(--accent);
    margin: 4px 0 10px;
  }

  .tag.warn {
    background: var(--warn-bg);
    color: var(--warn-text);
  }

  a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    overflow-wrap: anywhere;
  }

  a:hover { text-decoration: underline; }

  .muted {
    color: var(--muted);
    font-size: .92rem;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 12px 0 20px;
  }

  .controls input {
    padding: 12px 16px;
    border: 1px solid #d1d9e0;
    border-radius: 10px;
    background: white;
    color: var(--ink);
    font: inherit;
    flex: 1 1 260px;
    box-shadow: var(--shadow);
    transition: border-color 0.2s ease;
  }

  .controls input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 16px 0;
  }

  .tabs button {
    border: 1px solid #d1d9e0;
    background: white;
    border-radius: 10px;
    padding: 10px 20px;
    font: inherit;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: all 0.2s ease;
  }

  .tabs button:hover {
    color: var(--ink);
    border-color: var(--accent);
  }

  .tabs button.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
    box-shadow: 0 4px 12px rgba(70, 105, 82, 0.4);
  }

  .result-count {
    color: #b0bec5;
    font-size: .92rem;
    font-weight: 500;
    margin-bottom: 12px;
  }

  /* CONTAINER DAS ESFERAS */
  #contests {
    display: block;
    min-height: 120px;
  }

  .stage-section { margin-top: 28px; }

  .stage-title {
    font-size: 1.2rem;
    font-weight: 700;
    color: #9ac2a6; /* Verde Musgo claro e destacado no fundo escuro */
    border-bottom: 2px solid var(--accent);
    padding-bottom: 8px;
    margin-bottom: 16px;
  }

  .contest-list {
    display: grid;
    gap: 16px;
    margin-bottom: 24px;
  }
