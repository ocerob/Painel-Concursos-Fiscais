name: Atualização Automática do Painel Fiscal

on:
  workflow_dispatch:
  schedule:
    # Uma vez ao dia, 09:10 UTC (06:10 em Brasília). Ajuste se quiser outra frequência.
    - cron: '10 9 * * *'

permissions:
  contents: write

concurrency:
  group: atualizar-painel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Executar script de atualização
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python atualizar_painel.py

      - name: Commit e Push das alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados.json
          git diff --cached --quiet || git commit -m "Atualização automática do painel fiscal"
          git pull --rebase
          git push
